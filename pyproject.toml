[project]
name = "yandex_py"
description = "Yandex API wrapper for Python built on top of httpx and pydantic"
authors = [
    { name = "Fiodar Y.", email = "hi@fiodar.dev" },
]

version = "0.0.2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "model-bakery",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: tests against real Yandex Direct sandbox API (deselected by default)",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
